<!DOCTYPE html>
<!-- trying results from google -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebAssembly on GitHub Pages</title>
    <!-- Include Xterm.js Styles and Script -->
     <!-- had to download and push to this repo, so it's accessible via github pages -->
    <link rel="stylesheet" href="./xterm.css" />
    <script src="./xterm.js"></script>
    <!-- Include the Go WASM execution adapter -->
    <script src="./wasm_exec.js"></script>
</head>
<body style="background: #1a1a1a; margin: 0; padding: 20px;">

    <div id="terminal" style="width: 100%; height: 500px;"></div>

    <!-- from google AI results, launch terminal emulator so the app is actually usable -->
    <script>
        // 1. Initialize Xterm.js
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#1e1e1e' }
        });
        term.open(document.getElementById('terminal'));
        term.writeln('Initializing Go WebAssembly CLI...\r\n');

        let currentLine = '';

        // 2. Load and run the Go WASM Binary
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance); // Runs main() and registers runGoCommand
                term.write('Go CLI Ready. Type "help" to begin.\r\n\r\n$ ');
                setupTerminalInput();
            })
            .catch((err) => {
                term.writeln('Error loading WASM: ' + err);
            });

        // 3. Handle Terminal Interactivity
        function setupTerminalInput() {
            term.onData(e => {
                switch (e) {
                    case '\r': // Enter key
                        term.write('\r\n');
                        if (currentLine.trim().length > 0) {
                            // Call the Go function exposed via syscall/js
                            const output = window.runGoCommand(currentLine);
                            if (output) {
                                term.writeln(output);
                            }
                        }
                        currentLine = '';
                        term.write('$ ');
                        break;
                    case '\u007F': // Backspace
                        if (currentLine.length > 0) {
                            currentLine = currentLine.slice(0, -1);
                            term.write('\b \b');
                        }
                        break;
                    default: // Visible characters
                        currentLine += e;
                        term.write(e);
                }
            });
        }
    </script>
</body>
</html>
