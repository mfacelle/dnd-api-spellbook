<!DOCTYPE html>
<!-- trying results from google -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebAssembly on GitHub Pages</title>
    <!-- Include Xterm.js Styles and Script -->
     <!-- had to download and push to this repo, so it's accessible via github pages -->
    <link rel="stylesheet" href="./thirdparty/xterm/xterm.css" />
    <script src="./thirdparty/xterm/xterm.js"></script>
    <script src="./thirdparty/xterm/xterm.js.map"></script>
    <!-- Include the Go WASM execution adapter -->
    <script src="./wasm_exec.js"></script>
</head>
<body style="background: #1a1a1a; margin: 0; padding: 20px;">

    <div id="terminal" style="width: 100%; height: 500px;"></div>

    <script>
        // 1. Initialize Xterm.js
        const term = new Terminal({
            cursorBlink: true,
            rows: 24,
            cols: 120
        });
        term.open(document.getElementById('terminal'));
        term.writeln("Loading Go WebAssembly backend...");

        // 2. Initialize Go WASM Runtime
        const go = new Go();
        
        // 3. Provide a global write function for Go to output text to xterm.js
        window.sendToTerminal = (data) => {
            term.write(data);
        };

        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
            term.writeln("Go WASM Subsystem Active.\r\n");
            
            // 4. Feed keystrokes directly into Go WASM via a exposed function
            term.onData((data) => {
                if (window.handleTerminalInput) {
                    window.handleTerminalInput(data);
                }
            });
        }).catch((err) => {
            console.error("Failed to load WASM:", err);
        });
    </script>
</body>
</html>
