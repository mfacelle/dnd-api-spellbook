<!DOCTYPE html>
<!-- trying results from google -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebAssembly on GitHub Pages</title>
    <!-- Include Xterm.js Styles and Script -->
    <!-- <link rel="stylesheet" href="https://jsdelivr.net" /> -->
    <!-- <script src="https://jsdelivr.net"></script> -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
</head>
<body style="background: #1a1a1a; margin: 0; padding: 20px;">

  <div id="terminal"></div>

  <!-- Go WASM Support Script -->
  <script src="wasm_exec.js"></script>
  <script>
    const term = new Terminal();
    term.open(document.getElementById('terminal'));

    // Hook up Go stdio or custom JS bridge to xterm.js
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
