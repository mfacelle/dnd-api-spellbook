<!DOCTYPE html>
<!-- trying results from google -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebAssembly on GitHub Pages</title>
    <!-- Include Xterm.js Styles and Script -->
     <!-- had to download and push to this repo, so it's accessible via github pages -->
    <link rel="stylesheet" href="./thirdparty/xterm/xterm.css" />
    <script src="./thirdparty/xterm/xterm.js"></script>
    <!-- Include the Go WASM execution adapter -->
    <script src="./wasm_exec.js"></script>
</head>
<body style="background: #1a1a1a; margin: 0; padding: 20px;">

    <div id="terminal" style="width: 100%; height: 500px;"></div>

    <script>
        // set up xterm
        const term = new Terminal({
            cursorBlink: true,
            rows: 24,
            cols: 120
        });
        term.open(document.getElementById('terminal'));
        globalThis.term = term
        term.writeln("Loading Go WebAssembly backend...\r\n");

        // for storing current line
        let currentLine = '';

        // initialize and run Go
        const go = new Go();

        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
            
            // on data, handle special characters and pass completed lines into Go application
            term.onData((data) => {
                switch (data) {
                    case '\r': // enter key
                        term.write('\r\n');
                        // Send the complete line so Go's ReadString('\n') can return it.
                        const output = globalThis.handleTerminalInput(currentLine);
                        if (output) {
                            term.writeln(output);
                        }
                        currentLine = '';
                        break;
                    case '\u007F': // backspace
                        if (currentLine.length > 0) {
                            currentLine = currentLine.slice(0, -1);
                            term.write('\b \b');
                        }
                        break;
                    default: // normal characters
                        currentLine += data;
                        term.write(data);
                }
            });
        }).catch((err) => {
            console.error("Failed to load WASM:", err);
        });
    </script>
</body>
</html>
