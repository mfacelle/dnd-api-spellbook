<!DOCTYPE html>
<!-- trying results from google -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go WebAssembly on GitHub Pages</title>
    <!-- Include Xterm.js Styles and Script -->
     <!-- had to download and push to this repo, so it's accessible via github pages -->
    <link rel="stylesheet" href="./thirdparty/xterm/xterm.css" />
    <script src="./thirdparty/xterm/xterm.js"></script>
    <!-- Include the Go WASM execution adapter -->
    <script src="./wasm_exec.js"></script>
</head>
<body style="background: #1a1a1a; margin: 0; padding: 20px;">

    <div id="terminal" style="width: 100%; height: 500px;"></div>

    <!-- from google AI results, launch terminal emulator so the app is actually usable -->
    <script>
        // 1. Initialize Xterm.js
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#1e1e1e' }
        });
        term.open(document.getElementById('terminal'));
        window.term = term
        term.writeln('Initializing Go WebAssembly CLI...\r\n');

        <!-- trying really simple implementation for now -->
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });
    </script>
</body>
</html>
